name: Build Flutter customer APK

# The cloud development container cannot reach dl.google.com, so the Android build runs here.
on:
  push:
    branches: [main]
    paths: ['flutter-customer/**', '.github/workflows/flutter-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter-customer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ln-lokasi-flutter-debug
          path: flutter-customer/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
