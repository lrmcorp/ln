name: Deploy demo to Tencent Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ln-demo-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1/build
          SESSION_SECRET: build-only-placeholder-32-characters-long
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

  deploy:
    needs: validate
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check demo subdomain DNS
        id: dns
        run: |
          addresses="$(getent ahostsv4 int.lnint.xyz | awk '{print $1}' | sort -u || true)"
          ipv6_addresses="$(getent ahostsv6 int.lnint.xyz | awk '{print $1}' | grep -v '^::ffff:' | sort -u || true)"
          echo "A: ${addresses:-none}; native AAAA: ${ipv6_addresses:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$addresses" == "43.152.240.47" && -z "$ipv6_addresses" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'int.lnint.xyz resolves only to the Tencent VPS.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'int.lnint.xyz is not yet pointed only at the Tencent VPS; keeping the HTTP preview.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare pinned SSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ln_vps"
          cp deploy/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ln_vps" "$HOME/.ssh/known_hosts"
          ssh-keygen -F 43.152.240.47 -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Upload exact commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > .deploy-revision
          ssh -i "$HOME/.ssh/ln_vps" -o StrictHostKeyChecking=yes ubuntu@43.152.240.47 'mkdir -p ~/ln'
          rsync -az --delete -e "ssh -i $HOME/.ssh/ln_vps -o StrictHostKeyChecking=yes" \
            --exclude='.git/' --exclude='.next/' --exclude='node_modules/' \
            --exclude='.env*' ./ ubuntu@43.152.240.47:~/ln/
      - name: Enable HTTPS for demo subdomain
        if: steps.dns.outputs.ready == 'true'
        run: |
          ssh -i "$HOME/.ssh/ln_vps" -o StrictHostKeyChecking=yes ubuntu@43.152.240.47 \
            'cd ~/ln && bash deploy/init-vps-env.sh && sed -i -e "s|^CADDYFILE=.*|CADDYFILE=./Caddyfile.domain|" -e "s|^SITE_DOMAIN=.*|SITE_DOMAIN=int.lnint.xyz|" .env.vps'
      - name: Start and verify demo
        run: |
          ssh -i "$HOME/.ssh/ln_vps" -o StrictHostKeyChecking=yes ubuntu@43.152.240.47 \
            "cd ~/ln && bash deploy/init-vps-env.sh && sudo -n docker compose --env-file .env.vps -f deploy/compose.yaml up -d --build && test \"\$(cat .deploy-revision)\" = '$GITHUB_SHA' && curl -fsS --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:3000/pratinjau >/dev/null"
      # Read-only checks that separate a VPS-side block (ufw, Caddy, certificate) from the Tencent cloud firewall.
      - name: Diagnose public HTTPS reachability
        continue-on-error: true
        run: |
          for port in 22 80 443; do
            if timeout 6 bash -c "</dev/tcp/43.152.240.47/$port" 2>/dev/null; then echo "runner -> VPS TCP $port: open"; else echo "runner -> VPS TCP $port: blocked or closed"; fi
          done
          ssh -i "$HOME/.ssh/ln_vps" -o StrictHostKeyChecking=yes ubuntu@43.152.240.47 '
            echo "--- ufw"; sudo -n ufw status verbose 2>&1 || true
            echo "--- listeners"; sudo -n ss -ltnp 2>/dev/null | grep -E ":(80|443) " || true
            echo "--- on-server HTTPS"; curl -skS -o /dev/null -w "%{http_code}\n" --max-time 10 --resolve int.lnint.xyz:443:127.0.0.1 https://int.lnint.xyz/pratinjau || true
            echo "--- caddy log"; cd ~/ln && sudo -n docker compose --env-file .env.vps -f deploy/compose.yaml logs --tail 25 caddy 2>&1 | grep -iE "certificate|error|obtain|tls|listening" | tail -15 || true'
      - name: Verify public preview
        env:
          DNS_READY: ${{ steps.dns.outputs.ready }}
        run: |
          if [[ "$DNS_READY" == 'true' ]]; then
            curl -fsSL --connect-timeout 5 --max-time 12 --retry 5 --retry-delay 3 --retry-all-errors https://int.lnint.xyz/pratinjau >/dev/null
          else
            curl -fsSL --connect-timeout 5 --max-time 12 --retry 5 --retry-delay 3 --retry-all-errors http://43.152.240.47/pratinjau >/dev/null
          fi
