services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ln_dev
      POSTGRES_USER: ln_dev
      POSTGRES_PASSWORD: ln_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ln_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ln_dev -d ln_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ln_postgres:
